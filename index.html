<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF7EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2728%27 fill=%27%239FF2CF%27 stroke=%27%232A1E3F%27 stroke-width=%274%27/%3E%3Cellipse cx=%2724%27 cy=%2722%27 rx=%278%27 ry=%275%27 fill=%27%23fff%27 transform=%27rotate(-20 24 22)%27/%3E%3C/svg%3E">
<title>Cognitive Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap">
<style>
/* The front door: a flat pastel sticker world, nothing like the chrome arena behind it. */
:root {
  --cream: #FFF7EE; --ink: #2A1E3F; --mint: #9FF2CF; --pink: #FFB8D9; --butter: #FFEB99; --sky: #B8E4FF; --lilac: #D8C8FF; --white: #FFFFFF;
  --display: "Unbounded", "Arial Black", Impact, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow: hidden; -webkit-text-size-adjust: 100%; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Flat blobs drifting around the edges */
#sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.b { position: absolute; border-radius: 50%; border: 2.5px solid var(--ink); animation: float var(--dur) ease-in-out var(--delay) infinite alternate; will-change: transform; }
.b::after { content: ""; position: absolute; left: 22%; top: 16%; width: 26%; height: 16%; border-radius: 50%; background: rgb(255 255 255 / 0.7); transform: rotate(-20deg); }
@keyframes float { from { transform: translate(0, 0) scale(1, 1); } 50% { transform: translate(var(--dx), var(--dy)) scale(1.06, 0.94); } to { transform: translate(calc(var(--dx) * -0.6), calc(var(--dy) * 0.8)) scale(0.96, 1.05); } }
.b.fly { animation: fly 0.8s cubic-bezier(0.5, 0, 0.9, 0.4) var(--fd) forwards; }
@keyframes fly { 0% { transform: scale(1.15, 0.85); } 20% { transform: scale(0.9, 1.15); } 100% { transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(0.6); opacity: 0; } }

/* The card */
#gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
.card { width: min(26rem, 100%); background: var(--white); border: 2.5px solid var(--ink); border-radius: 28px; box-shadow: 10px 10px 0 var(--pink); padding: 28px 24px 24px; display: grid; gap: 14px; justify-items: center; text-align: center; transform-origin: 50% 100%; }
.chip { display: inline-block; font: 900 0.68rem/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--butter); }
h1 { font: 900 clamp(2rem, 9vw, 2.7rem)/1 var(--display); letter-spacing: -0.03em; text-wrap: balance; }
h1 em { font-style: normal; background: linear-gradient(transparent 58%, var(--mint) 58%); padding: 0 0.1em; }
.lede { font-size: 1rem; max-width: 20rem; text-wrap: balance; }
form { display: grid; gap: 10px; width: 100%; }
.field { width: 100%; min-height: 50px; font: 700 1.1rem/1 var(--body); color: var(--ink); background: var(--cream); border: 2.5px solid var(--ink); border-radius: 999px; padding: 0 18px; text-align: center; letter-spacing: 0.06em; }
.field::placeholder { color: rgb(42 30 63 / 0.45); letter-spacing: 0; font-weight: 600; }
.field:focus { outline: none; box-shadow: 4px 4px 0 var(--sky); }
.field:disabled { opacity: 0.6; }
.btn { appearance: none; cursor: pointer; min-height: 52px; font: 900 1.05rem/1 var(--display); letter-spacing: 0.02em; color: var(--ink); background: var(--mint); border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 5px 5px 0 var(--ink); transition: transform 0.12s, box-shadow 0.12s; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.btn:disabled { cursor: default; background: var(--lilac); }
.msg { min-height: 1.5em; font-weight: 700; color: var(--ink); }
.msg.bad { color: #C8347C; }
.tiny { font-size: 0.78rem; color: rgb(42 30 63 / 0.6); }
.card.shake { animation: shake 0.42s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px) rotate(-1deg); } 40% { transform: translateX(10px) rotate(1deg); } 60% { transform: translateX(-7px); } 80% { transform: translateX(5px); } }
.card.pop { animation: pop 0.35s var(--spring); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06, 0.94); } 100% { transform: scale(1); } }
.card.melt { animation: melt 0.75s cubic-bezier(0.6, 0, 0.8, 0.2) forwards; }
@keyframes melt { 0% { transform: scale(1, 1); border-radius: 28px; } 30% { transform: scale(1.08, 0.9); } 55% { transform: scale(0.94, 1.12); border-radius: 40px; } 100% { transform: scale(1.3, 0); border-radius: 50%; opacity: 0; } }

/* White wash, then the intro */
#wash { position: fixed; inset: 0; background: var(--white); opacity: 0; pointer-events: none; transition: opacity 0.55s ease; }
#wash.on { opacity: 1; }
#intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: var(--white); color: var(--ink); text-align: center; cursor: pointer; }
#intro[hidden] { display: none; }
.credits { display: grid; gap: 4px; justify-items: center; }
.credits .by { font: 900 0.72rem/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: rgb(42 30 63 / 0.55); margin-top: 18px; }
.credits h2 { font: 900 clamp(1.5rem, 7vw, 2.4rem)/1.15 var(--display); letter-spacing: -0.02em; }
.credits h2 i { font-style: normal; display: inline-block; width: 0.5em; height: 0.5em; border-radius: 50%; border: 2px solid var(--ink); vertical-align: middle; margin-left: 0.3em; background: var(--pink); }
.credits h2:last-of-type i { background: var(--mint); }
.credits > * { opacity: 0; transform: translateY(14px); animation: rise 0.6s var(--spring) forwards; }
.credits > :nth-child(1) { animation-delay: 0.05s; } .credits > :nth-child(2) { animation-delay: 0.15s; } .credits > :nth-child(3) { animation-delay: 0.55s; } .credits > :nth-child(4) { animation-delay: 0.65s; }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }
.skip { position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 0.78rem; color: rgb(42 30 63 / 0.5); }
@media (prefers-reduced-motion: reduce) { .b, .card.shake, .card.pop, .card.melt, .credits > * { animation: none !important; } .credits > * { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<div id="gate">
  <main id="card" class="card" aria-label="Unlock">
    <span class="chip">Private beta</span>
    <h1>Cognitive <em>Drift</em></h1>
    <p class="lede">Enter the code to unlock the beta.</p>
    <form id="form" autocomplete="off">
      <input id="pass" class="field" type="text" placeholder="Code" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Beta code" maxlength="64">
      <button id="go" class="btn" type="submit">Unlock</button>
    </form>
    <p id="msg" class="msg" aria-live="polite"></p>
    <p class="tiny">Ask the person who sent you here for the code.</p>
  </main>
</div>

<div id="wash"></div>
<section id="intro" hidden aria-label="Credits">
  <div class="credits">
    <p class="by">A game by</p>
    <h2>Oscar Sanchez<i></i></h2>
    <p class="by">Produced by</p>
    <h2>Cogsec Games<i></i></h2>
  </div>
  <p class="skip">tap to skip</p>
</section>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var ITER = 310000, STORE = "cd-unlock", DAY = 864e5, MAGIC = "OSAN1", INTRO_MS = 2000;
  var card = $("card"), form = $("form"), pass = $("pass"), go = $("go"), msg = $("msg");
  var reduced = false; try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  // ---- the blobs: flat pastel circles around the edges, never over the card
  var COLORS = ["#9FF2CF", "#FFB8D9", "#FFEB99", "#B8E4FF", "#D8C8FF"];
  var blobs = [];
  (function sky() {
    var sky = $("sky"), W = window.innerWidth, H = window.innerHeight, n = W < 600 ? 7 : 10;
    for (var i = 0; i < n; i++) {
      var b = document.createElement("i"), s = 50 + Math.random() * (W < 600 ? 110 : 190), side = i % 4, x, y;
      if (side === 0) { x = Math.random() * W; y = -s * 0.5 + Math.random() * H * 0.18; }
      else if (side === 1) { x = W - s * 0.6 - Math.random() * W * 0.12; y = Math.random() * H; }
      else if (side === 2) { x = Math.random() * W; y = H - s * 0.55 - Math.random() * H * 0.14; }
      else { x = -s * 0.4 + Math.random() * W * 0.1; y = Math.random() * H; }
      b.className = "b";
      b.style.cssText = "left:" + x.toFixed(0) + "px;top:" + y.toFixed(0) + "px;width:" + s.toFixed(0) + "px;height:" + s.toFixed(0) + "px;background:" + COLORS[i % COLORS.length] + ";--dur:" + (5 + Math.random() * 5).toFixed(1) + "s;--delay:-" + (Math.random() * 6).toFixed(1) + "s;--dx:" + ((Math.random() - 0.5) * 60).toFixed(0) + "px;--dy:" + ((Math.random() - 0.5) * 60).toFixed(0) + "px";
      sky.appendChild(b); blobs.push({ el: b, x: x + s / 2, y: y + s / 2 });
    }
  })();

  // ---- the game, encrypted with the beta code: fetched right away, opened once the code checks out
  var encP = fetch("game.enc", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.arrayBuffer(); }).then(parse).catch(function () { return null; });
  function parse(buf) {
    var u = new Uint8Array(buf);
    if (u.length < 5 + 16 + 12 + 17) throw new Error("short");
    var magic = String.fromCharCode.apply(null, u.subarray(0, 5));
    if (magic !== MAGIC) throw new Error("magic");
    return { salt: u.subarray(5, 21), iv: u.subarray(21, 33), data: u.subarray(33) };
  }
  function keyFromPass(text, salt) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(text), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function open(key, enc) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: enc.iv }, key, enc.data).then(function (pt) { return new TextDecoder().decode(pt); }); }
  function toB64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function remember(key) { crypto.subtle.exportKey("raw", key).then(function (raw) { try { localStorage.setItem(STORE, JSON.stringify({ k: toB64(raw), until: Date.now() + DAY })); } catch (e) {} }).catch(function () {}); }
  function recalled() {
    try {
      var j = JSON.parse(localStorage.getItem(STORE) || "null");
      if (!j || !j.k || !(j.until > Date.now())) return null;
      return crypto.subtle.importKey("raw", fromB64(j.k), { name: "AES-GCM" }, true, ["decrypt"]);
    } catch (e) { return null; }
  }
  function forget() { try { localStorage.removeItem(STORE); } catch (e) {} }

  // ---- unlocking
  var busy = false, launched = false, html = null;
  function say(text, bad) { msg.textContent = text; msg.classList.toggle("bad", !!bad); }
  function tryPass(e) {
    e.preventDefault();
    if (busy || launched) return;
    var text = pass.value;
    if (!text) { pass.focus(); return; }
    if (!window.crypto || !crypto.subtle) { say("Open this page over https to unlock it.", true); return; }
    busy = true; go.disabled = true; pass.disabled = true; go.textContent = "Checking...";
    encP.then(function (enc) {
      if (!enc) throw new Error("missing");
      return keyFromPass(text, enc.salt).then(function (key) { return open(key, enc).then(function (text2) { remember(key); return text2; }); });
    }).then(function (text2) {
      html = text2; say("");
      unlockShow().then(intro).then(launch);
    }).catch(function (err) {
      var missing = err && err.message === "missing";
      say(missing ? "The game file didn't load. Refresh and try again." : "Nope.", true);
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      setTimeout(function () { busy = false; go.disabled = false; pass.disabled = false; go.textContent = "Unlock"; pass.select(); pass.focus(); }, missing ? 300 : 1000);
    });
  }
  // the card melts, the blobs scatter, everything washes to white
  function unlockShow() {
    return new Promise(function (done) {
      if (reduced) { $("wash").classList.add("on"); setTimeout(done, 300); return; }
      card.classList.add("pop");
      setTimeout(function () {
        var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        blobs.forEach(function (b, i) {
          var dx = b.x - cx, dy = b.y - cy, l = Math.hypot(dx, dy) || 1, k = 1.6 * Math.max(window.innerWidth, window.innerHeight) / l;
          b.el.style.setProperty("--fx", (dx * k).toFixed(0) + "px"); b.el.style.setProperty("--fy", (dy * k).toFixed(0) + "px"); b.el.style.setProperty("--fr", ((Math.random() - 0.5) * 240).toFixed(0) + "deg"); b.el.style.setProperty("--fd", (i * 0.03).toFixed(2) + "s");
          b.el.classList.add("fly");
        });
      }, 120);
      setTimeout(function () { card.classList.remove("pop"); card.classList.add("melt"); }, 260);
      setTimeout(function () { $("wash").classList.add("on"); }, 760);
      setTimeout(done, 1250);
    });
  }
  // two seconds of credits, or a tap
  function intro() {
    return new Promise(function (done) {
      var box = $("intro"), over = false;
      function finish() { if (over) return; over = true; box.removeEventListener("click", finish); window.removeEventListener("keydown", finish); done(); }
      box.hidden = false; $("gate").style.display = "none";
      box.addEventListener("click", finish); window.addEventListener("keydown", finish);
      setTimeout(finish, INTRO_MS);
    });
  }
  function launch() {
    if (launched || !html) return;
    launched = true;
    document.open(); document.write(html); document.close();
  }
  form.addEventListener("submit", tryPass);
  // unlocked within the last day: straight to the credits
  var kp = recalled();
  if (kp) {
    busy = true; go.disabled = true; pass.disabled = true; go.textContent = "Opening...";
    Promise.all([kp, encP]).then(function (r) { if (!r[0] || !r[1]) throw new Error("x"); return open(r[0], r[1]); }).then(function (text2) {
      html = text2; $("wash").classList.add("on");
      setTimeout(function () { intro().then(launch); }, 350);
    }).catch(function () { forget(); busy = false; go.disabled = false; pass.disabled = false; go.textContent = "Unlock"; });
  }
  pass.focus();
  window.__gate = { ready: function () { return encP.then(function (e) { return !!e; }); }, launched: function () { return launched; } };
})();
</script>
</body>
</html>
